name: docs-to-pdf
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formal docs exist
        run: |
          for f in BRD PRD ARCHITECTURE; do test -s "$f.md" || { echo "missing $f.md"; exit 1; }; done
          echo "docs OK"
      - name: Check README index
        run: |
          grep -q "BRD.md" README.md && grep -q "PRD.md" README.md \
            && grep -q "ARCHITECTURE.md" README.md \
            || { echo "README index incomplete"; exit 1; }
          echo "links OK"
  pdf:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PDFs
        # xelatex (not pdflatex): docs contain Unicode (≥, →, ─, ▼) that
        # pdflatex cannot typeset. Verified locally with pandoc/latex:3.1.
        run: |
          mkdir -p pdf
          for f in BRD PRD ARCHITECTURE; do
            docker run --rm -v "$PWD:/data" -w /data pandoc/latex:3.1 \
              "$f.md" -o "pdf/Pulse-$f.pdf" --pdf-engine=xelatex \
              -V geometry:margin=2.5cm --toc \
              --metadata title="Pulse $f"
          done
          ls -la pdf/
      - name: Check PDFs readable
        run: |
          for f in BRD PRD ARCHITECTURE; do
            test -s "pdf/Pulse-$f.pdf" || { echo "empty pdf/Pulse-$f.pdf"; exit 1; }
          done
          echo "PDFs OK"
      - name: Release PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" pdf/*.pdf \
            --title "${{ github.ref_name }} - Pulse Documents" \
            --notes "BRD, PRD, ARCHITECTURE (PDF). Markdown sources available at this tag."
